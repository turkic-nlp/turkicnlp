[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turkicnlp"
version = "0.4.0"
description = "NLP toolkit for Turkic languages"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    {name = "Sherzod Hakimov", email = "sherzodhakimov@gmail.com"},
]
keywords = [
    "nlp", "toolkit", "turkic", "kazakh", "turkish", "turkmen", "uzbek", "azerbaijani",
    "kyrgyz", "tatar", "uyghur", "stanza", "linguistics",
    "morphology", "pos-tagging", "dependency-parsing", "asr", "ner", "machine-translation", "embeddings"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Natural Language :: Turkish"
]

dependencies = [
    "numpy>=1.24",
    "regex>=2022.1.18",
]

[project.optional-dependencies]
hfst = [
    "hfst>=3.12.0.2b0",
]
stanza = [
    # The custom Stanza models (aze, uzb, tuk, tat, bak) were trained with
    # Stanza 1.11; Stanza 1.15 fails to load their parsers (deprel size mismatch).
    "stanza>=1.8,<1.12",
]
lid = [
    "fasttext-wheel>=0.9",
    "huggingface_hub>=0.20",
]
translation = [
    "torch>=2.0",
    "transformers>=4.30",
    "tokenizers>=0.13",
    "sentencepiece>=0.1.99",
]
asr = [
    "omnilingual-asr>=0.2; python_version >= '3.10' and python_version < '3.13'",
    "soundfile>=0.12",
    # omnilingual-asr pins torch 2.8 (fairseq2 0.6) but not torchaudio; a newer
    # torchaudio fails to load against torch 2.8.
    "torchaudio>=2.8,<2.9; python_version >= '3.10' and python_version < '3.13'",
]
transformers = [
    "torch>=2.0",
    "transformers>=4.30",
    "tokenizers>=0.13",
    # Needed to build the Glot500 (XLM-R) tokenizer with transformers 4.x
    "sentencepiece>=0.1.99",
]
all = [
    "hfst>=3.12.0.2b0",
    "stanza>=1.8,<1.12",
    "fasttext-wheel>=0.9",
    "huggingface_hub>=0.20",
    "torch>=2.0",
    "transformers>=4.30",
    "tokenizers>=0.13",
    "sentencepiece>=0.1.99",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/turkic-nlp/turkicnlp"
Documentation = "https://turkic-nlp.github.io/toolkit"
Repository = "https://github.com/turkic-nlp/turkicnlp"
Issues = "https://github.com/turkic-nlp/turkicnlp/issues"

[tool.setuptools.packages.find]
include = ["turkicnlp*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
turkicnlp = [
    "resources/*.json",
    "resources/lexicons/*.json",
    "resources/mwt_rules/*.json",
    "resources/mwt_rules_extracted/*.json",
    "resources/tag_mappings/*.json",
]

[tool.pytest.ini_options]
testpaths = ["turkicnlp/tests"]
markers = [
    "slow: marks tests that require model downloads",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.black]
line-length = 100
target-version = ["py39"]
